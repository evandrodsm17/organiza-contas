name: CI and Deploy VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organiza-contas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate operational scripts and Compose
        env:
          APP_DOMAIN: organiza-contas.vps11931.panel.icontainer.cloud
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/github-deploy.sh deploy/backup.sh
          docker compose config --quiet
      - name: Exercise deployment and rollback with isolated stubs
        run: bash test/deploy.test.sh

  deploy:
    name: Deploy production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: Production
      url: https://organiza-contas.vps11931.panel.icontainer.cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the production image
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "organiza-contas:$GITHUB_SHA" .
          docker run --rm --network none -e NODE_ENV=test \
            -v "$PWD/test:/app/test:ro" "organiza-contas:$GITHUB_SHA" sh -c 'node --test /app/test/*.test.mjs'
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/organiza-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/organiza-deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy the exact tested image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          docker save "organiza-contas:$GITHUB_SHA" | gzip -1 | \
            ssh -i "$HOME/.ssh/organiza-deploy" -p "$VPS_PORT" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
              "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA"
      - name: Verify the public revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://organiza-contas.vps11931.panel.icontainer.cloud/api/health \
            | python3 -c 'import json,os,sys; r=json.load(sys.stdin); assert r["ok"] and r["revision"] == os.environ["EXPECTED_REVISION"]'
          echo "Deployed commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'https://organiza-contas.vps11931.panel.icontainer.cloud' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the runner SSH key
        if: always()
        run: rm -f "$HOME/.ssh/organiza-deploy"
