name: organiza-contas
services:
  app:
    build: .
    image: organiza-contas:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      APP_REVISION: ${APP_IMAGE_TAG:-local}
      APP_ORIGIN: https://${APP_DOMAIN:?Defina APP_DOMAIN no .env}
      TRUST_PROXY: "1"
      ATTACHMENT_ENCRYPTION_KEY: ${ATTACHMENT_ENCRYPTION_KEY:?Defina ATTACHMENT_ENCRYPTION_KEY no .env}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_CONTACT: ${WEB_PUSH_CONTACT:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:3080:3000"
    mem_limit: 768m
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # Use este perfil somente se não houver proxy/painel ocupando 80 e 443.
  proxy:
    profiles: [standalone]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Defina APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  app_data:
  caddy_data:
  caddy_config:
