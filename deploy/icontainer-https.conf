server {
    listen 80;
    server_name organiza-contas.vps11931.panel.icontainer.cloud;
    location /.well-known/acme-challenge/ {
        root /www/sites/organiza-contas.vps11931.panel.icontainer.cloud/acme;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name organiza-contas.vps11931.panel.icontainer.cloud;
    ssl_certificate /www/sites/organiza-contas.vps11931.panel.icontainer.cloud/letsencrypt/live/organiza-contas.vps11931.panel.icontainer.cloud/fullchain.pem;
    ssl_certificate_key /www/sites/organiza-contas.vps11931.panel.icontainer.cloud/letsencrypt/live/organiza-contas.vps11931.panel.icontainer.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    location / {
        # Remover o return de manutenção somente após importar e conferir os dados.
        default_type text/plain;
        return 503 "Organiza Contas: migracao em preparacao. O sistema anterior continua disponivel.\n";
        proxy_pass http://127.0.0.1:3080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
